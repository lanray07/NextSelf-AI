name: Archive and Upload to App Store Connect

on:
  push:
    tags:
      - "app-store-upload-*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to upload"
        required: true
        default: "1"

jobs:
  archive-upload:
    runs-on: macos-26
    env:
      BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.app/Contents/Developer"
          elif [ -n "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print -quit)" ]; then
            sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print -quit)/Contents/Developer"
          else
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf "%s" "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.generated.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set +e
          xcodebuild \
            -project "NextSelfAI.xcodeproj" \
            -scheme "NextSelf AI" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/NextSelfAI.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            clean archive 2>&1 | tee archive.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Archive error summary"
            grep -E "error:|warning:|ARCHIVE FAILED|BUILD FAILED|No Accounts|provision|Provisioning|Signing|CodeSign|requires a provisioning profile|No signing certificate|The operation couldn" archive.log | tail -n 80 || true
            echo "::endgroup::"
            first_error="$(grep -E "error:|ARCHIVE FAILED|BUILD FAILED|No Accounts|requires a provisioning profile|No signing certificate|The operation couldn" archive.log | head -n 1 || true)"
            if [ -n "$first_error" ]; then
              echo "::error title=Xcode archive failed::$first_error"
            fi
            exit "$status"
          fi

      - name: Export IPA
        run: |
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/NextSelfAI.xcarchive" \
            -exportOptionsPlist ExportOptions.generated.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            -exportPath "$PWD/build/export" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Export error summary"
            grep -E "error:|warning:|EXPORT FAILED|No Accounts|provision|Provisioning|Signing|CodeSign|requires a provisioning profile|No signing certificate|The operation couldn" export.log | tail -n 80 || true
            echo "::endgroup::"
            first_error="$(grep -E "error:|EXPORT FAILED|No Accounts|requires a provisioning profile|No signing certificate|The operation couldn" export.log | head -n 1 || true)"
            if [ -n "$first_error" ]; then
              echo "::error title=Xcode export failed::$first_error"
            fi
            exit "$status"
          fi

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$PWD/build/export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          set +e
          xcrun altool \
            --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format xml 2>&1 | tee validate.log
          validate_status=${PIPESTATUS[0]}
          if [ "$validate_status" -ne 0 ]; then
            diagnostic="$(tail -n 80 validate.log || true)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            echo "::error title=App Store Connect validation failed::$diagnostic"
            exit "$validate_status"
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format xml 2>&1 | tee upload.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Upload error summary"
            grep -E "Error|error|ERROR|Failed|failed|invalid|Invalid|issuer|API|asset|bundle|version|build|privacy|agreement|contract|provider|authentication|authorized|authorization|not found|No such" upload.log | tail -n 120 || true
            echo "::endgroup::"
            diagnostic="$(tail -n 80 upload.log || true)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            echo "::error title=App Store Connect upload failed::$diagnostic"
            exit "$status"
          fi
